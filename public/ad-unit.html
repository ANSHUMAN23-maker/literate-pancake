<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sponsored</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      :root {
        --bg-color: #ffffff;
        --text-color: #0f172a;
      }
      :root[data-theme="dark"] {
        --bg-color: #0b111e;
        --text-color: #e2e8f0;
      }
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--text-color);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 120px;
        width: 100%;
        background-color: var(--bg-color);
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      .ad-scaler-box {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      #container-0b4df5b173810fed2c353725140669a7 {
        width: 100% !important;
        text-align: center;
        display: flex;
        justify-content: center;
        transform-origin: center top;
        will-change: transform;
      }
      #container-0b4df5b173810fed2c353725140669a7 iframe {
        max-width: 100% !important;
      }
    </style>
  </head>
  <body>
    <div id="ad-scaler-box" class="ad-scaler-box">
      <!-- Adsterra Native Banner Script (Isolated Context) -->
      <script async="async" data-cfasync="false" src="https://bellnewyork.org/21/0b4df5b173810fed2c353725140669a7"></script>
      <div id="container-0b4df5b173810fed2c353725140669a7"></div>
    </div>
    <script>
      function syncTheme() {
        var theme = 'light';
        try {
          if (window.parent && window.parent.document) {
            theme = window.parent.document.documentElement.getAttribute('data-theme') || 'light';
          }
        } catch (e) {
          var params = new URLSearchParams(window.location.search);
          if (params.get('theme')) {
            theme = params.get('theme');
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        }
        document.documentElement.setAttribute('data-theme', theme);
      }

      function updateScale() {
        var container = document.getElementById('container-0b4df5b173810fed2c353725140669a7');
        var scalerBox = document.getElementById('ad-scaler-box');
        if (!container) return;

        var targetW = 600; // Native 4:1 width
        var availableW = window.innerWidth;

        if (availableW < targetW && availableW > 0) {
          var scale = Math.max(0.48, Math.min(1, availableW / targetW));
          container.style.width = targetW + 'px';
          container.style.transform = 'scale(' + scale.toFixed(3) + ')';
          if (scalerBox) {
            scalerBox.style.height = Math.ceil(135 * scale) + 'px';
          }
        } else {
          container.style.width = '100%';
          container.style.transform = 'none';
          if (scalerBox) {
            scalerBox.style.height = 'auto';
          }
        }
      }

      window.addEventListener('message', function (e) {
        if (e.data && e.data.theme) {
          document.documentElement.setAttribute('data-theme', e.data.theme);
        }
      });

      syncTheme();
      updateScale();
      window.addEventListener('resize', updateScale);
      window.addEventListener('DOMContentLoaded', updateScale);
      var checkCount = 0;
      var timer = setInterval(function () {
        updateScale();
        syncTheme();
        if (++checkCount > 15) clearInterval(timer);
      }, 350);
    </script>
  </body>
</html>
